schema_version: 1

context:
  name: blivet
  version: "3.14.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/blivet-${{ version }}.tar.gz
  sha256: 782894492153bae67a8219df08fd18c92db3eca5bf8a17ac8e3c7c32a24d6758

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 1

requirements:
  host:
    - pip
    - setuptools
    - wheel
    - python
  run:
    - libblockdev
    - libbytesize
    - dasbus >=1.7
    - packaging
    - lvm2 >=2.03.17
    - util-linux
    - pygobject
    - pyparted
    - python
    - pyudev

tests:
  - python:
      imports:
        - blivet
      pip_check: true

about:
  homepage: http://github.com/storaged-project/blivet
  summary: Python module for system storage configuration
  license: GPL-2.0-only AND LGPL-2.1-only
  license_file:
    - COPYING
    - COPYING.LESSER

extra:
  recipe-maintainers:
    - Geertsky
