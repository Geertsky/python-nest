schema_version: 1

context:
  version: "1.9.0"

package:
  name: f2fs-tools
  version: ${{ version }}

source:
  url: https://github.com/Sys-AI-Foundation/f2fs-tools/archive/refs/tags/v${{ version }}.tar.gz
  md5: 36d480efae8ec6021a6a3c638d40f3b2

build:
  number: 4
  script: build.sh

requirements:
  build:
    - autoconf
    - automake
    - pkg-config
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - libtool
  host:
    - libuuid
    - libselinux-conda-x86_64

tests:
  - script:
      - f2fscrypt help add_key
      - test -x $PREFIX/bin/mkfs.f2fs
      - test -x $PREFIX/bin/f2fstat
      - test -x $PREFIX/bin/fibmap.f2fs
      - test -x $PREFIX/bin/parse.f2fs
      - test -x $PREFIX/bin/fsck.f2fs

about:
  homepage: https://github.com/Sys-AI-Foundation/f2fs-tools
  summary: Tools for the Flash-Friendly File System (F2FS), such as mkfs.f2fs and fsck.f2fs
  # COPYING: the tools are GPL version 2; include/f2fs_fs.h and lib/libf2fs.c are also LGPL 2.1.
  license: GPL-2.0-only
  license_file: COPYING

extra:
  recipe-maintainers:
    - Geertsky
