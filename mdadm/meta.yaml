{% set name = "mdadm" %}
{% set version = "4.4" %}   # check https://www.kernel.org/pub/linux/utils/raid/mdadm/ for the latest

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://www.kernel.org/pub/linux/utils/raid/mdadm/mdadm-{{ version }}.tar.xz
  sha256: 9b488f35ed153df99924b5fe41eed380e8512de8f18a118628cacdd681b1d573

build:
  number: 0
  skip: true  # [not linux]    # mdadm uses the Linux md driver only

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - make
    - pkg-config
  host:
    - libudev
  run: []

test:
  commands:
    - mdadm --version
    - mdadm --help
    - test -f $PREFIX/share/man/man8/mdadm.8   # [linux]

about:
  home: https://git.kernel.org/pub/scm/utils/mdadm/mdadm.git
  summary: Tool to create, assemble and manage Linux software RAID (md) arrays
  license: GPL-2.0-or-later
  license_file: COPYING
  doc_url: https://raid.wiki.kernel.org/index.php/A_guide_to_mdadm
  dev_url: https://git.kernel.org/pub/scm/utils/mdadm/mdadm.git
