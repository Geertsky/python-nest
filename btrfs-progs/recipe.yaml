schema_version: 1

context:
  version: "7.1"

package:
  name: btrfs-progs
  version: ${{ version }}

source:
  url: https://www.kernel.org/pub/linux/kernel/people/kdave/btrfs-progs/btrfs-progs-v${{ version }}.tar.xz
  md5: 5dbaaf17567022405d6fc9d0d185e812

build:
  number: 4
  skip:
    - not unix

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - make
    - pkg-config
  host:
    - lvm2
    - libuuid
    - zlib
    - e2fsprogs
    - util-linux
    - lzo >=2.0
    - python
    - setuptools
    - zstd >=1.0.0
    - libudev <258  # el8 (kernel 4.18) lacks statx STATX_MNT_ID, which libudev >=260 requires; 258-261.1 also need glibc 2.34
  run:
    - e2fsprogs-libs

tests:
  - script:
      - btrfs --help
      - btrfsck --help
      - btrfs-convert --help
      - btrfs-find-root --help
      - btrfs-image --help
      - test -x $PREFIX/bin/btrfs-map-logical
      - test -x $PREFIX/bin/btrfs-select-super
      - btrfstune --help
      - test -x $PREFIX/bin/fsck.btrfs
      - mkfs.btrfs --help

about:
  homepage: https://xfs.wiki.kernel.org/
  license: GPL-2.0-only
  license_file:
    - COPYING
  summary: BTRFS COW Filesystem
  description: |
    BTRFS is a modern copy on write (COW) filesystem for Linux aimed at implementing advanced features while also focusing on fault tolerance, repair and easy administration. Its main features and benefits are:
      - Snapshots which do not make a full copy of the files
      - Built-in volume management, support for software-based RAID 0, RAID 1, RAID 10 and others
      - Self-healing - checksums for data and metadata, automatic detection of silent data corruptions
      - Data compression
      - Reflinks, fast and efficient file copies
  documentation: https://btrfs.readthedocs.io/en/latest/index.html
  repository: https://btrfs.readthedocs.io/en/latest/dev/Development-notes.html

extra:
  recipe-maintainers:
    - Geertsky
