schema_version: 1

package:
  name: cryptsetup
  version: "2.8.8"

source:
  url: https://www.kernel.org/pub/linux/utils/cryptsetup/v2.8/cryptsetup-2.8.8.tar.xz
  md5: 36d480efae8ec6021a6a3c638d40f3b2

build:
  number: 2
  script: build.sh

requirements:
  run_exports:
    - ${{ pin_subpackage('cryptsetup', upper_bound='x.x') }}
  build:
    - autoconf
    - automake
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
  host:
    - json-c
    - lvm2
    - libssh
    - pkg-config
    - popt
    - util-linux

tests:
  - script:
      - cryptsetup --help
      - integritysetup --help
      - veritysetup --help
      - test -f ${PREFIX}/lib/libcryptsetup.so.12.11.0
      - test -f ${PREFIX}/lib/pkgconfig/libcryptsetup.pc

about:
  homepage: https://github.com/mbroz/cryptsetup
  license: LGPL-2.1-only
  documentation: https://gitlab.com/cryptsetup/cryptsetup#documentation

extra:
  recipe-maintainers:
    - Geertsky
