schema_version: 1

context:
  version: "r62"

package:
  name: inih
  version: ${{ version }}

source:
  url: https://github.com/benhoyt/inih/archive/${{ version }}/inih-${{ version }}.tar.gz
  sha256: 9c15fa751bb8093d042dae1b9f125eb45198c32c6704cd5481ccde460d4f8151

build:
  number: 2
  script: build.sh
  skip:
    - not unix

requirements:
  run_exports:
    - ${{ pin_subpackage('inih', upper_bound='x') }}
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - meson
    - pkg-config

tests:
  - script:
      - test -f $PREFIX/include/ini.h
      - test -f $PREFIX/include/INIReader.h
      - test -f $PREFIX/lib/pkgconfig/inih.pc
      - test -f $PREFIX/lib/pkgconfig/INIReader.pc
      - test -f $PREFIX/lib/libinih.so
      - test -f $PREFIX/lib/libINIReader.so

about:
  homepage: https://github.com/benhoyt/inih
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Simple INI file parser written in C
  description: |
    inih (INI Not Invented Here) is a small and simple INI file parser
    written in C. It is designed to be lightweight and suitable for
    embedded systems, while providing parsing behavior similar to
    Python's ConfigParser.
  repository: https://github.com/benhoyt/inih

extra:
  recipe-maintainers:
    - Geertsky
