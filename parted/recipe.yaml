schema_version: 1

context:
  version: "3.7"

package:
  name: parted
  version: ${{ version }}

source:
  url: https://ftp.gnu.org/gnu/parted/parted-${{ version }}.tar.xz
  sha256: 008de57561a4f3c25a0648e66ed11e7b30be493889b64334a6d70f2c1951ef7b

build:
  number: 0
  script: build.sh
  skip:
    - not unix

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - make
    - pkg-config
  host:
    - dosfstools
    - e2fsprogs
    - libuuid
    - lvm2
    - ncurses
  run:
    - lvm2

tests:
  - script:
      - parted --help

about:
  homepage: http://www.gnu.org/software/parted
  summary: GNU Parted is a program for creating and manipulating partition tables.
  documentation: http://www.gnu.org/software/parted/manual/parted.html
  license: GPL-3.0-or-later
  license_file:
    - COPYING

extra:
  recipe-maintainers:
    - Geertsky
