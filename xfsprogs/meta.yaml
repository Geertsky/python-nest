{% set version = "7.2.0" %}
package:
  name: xfsprogs
  version: {{ version }}

source:
  url: https://www.kernel.org/pub/linux/utils/fs/xfs/xfsprogs/xfsprogs-{{ version }}.tar.gz
  sha256: 8714402bd270512cd5140614c86df5076350c36114f2efb4208ca15a794c3e6d

build:
  number: 5
  skip: true # [not unix]

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - make
    - pkg-config
    - kernel-headers_linux-64 >=4.18.0
  host:
    - util-linux
    - libuuid
    - inih >=r62
    - liburcu >=0.15.7
    - icu >=78.3
test:
  commands:
    - test -f $PREFIX/bin/fsck.xfs
    - test -f $PREFIX/bin/mkfs.xfs
    - xfs_admin -V
    - xfs_bmap -V
    - xfs_copy -V
    - xfs_db -V
    - xfs_estimate -V
    - xfs_freeze -V
    - xfs_fsr -V
    - xfs_growfs -V
    - xfs_info -V
    - xfs_io -V
    - xfs_logprint -V
    - xfs_mdrestore -V
    - xfs_metadump -V
    - xfs_mkfile -V
    - xfs_ncheck -V
    - xfs_property -V
    - xfs_quota -V
    - xfs_repair -V
    - xfs_rtcp -V
    - xfs_spaceman -V

about:
  home: https://xfs.wiki.kernel.org/
  license: GPL-2.0-only AND LGPL-2.1-only
  license_file:
    - LICENSES/GPL-2.0
    - LICENSES/LGPL-2.1
  summary: XFS filesystem utilities
  description: |
    xfsprogs provides the userspace utilities for creating, inspecting,
    repairing, growing, and otherwise managing XFS filesystems.
  doc_url: https://xfs.wiki.kernel.org/
  dev_url: https://git.kernel.org/pub/scm/fs/xfs/xfsprogs-dev.git/

extra:
  recipe-maintainers:
    - Geertsky
